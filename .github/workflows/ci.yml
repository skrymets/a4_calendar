name: CI

# Every gate the release runs, run early, so tagging is a formality rather than a gamble.
# release.yml calls this same workflow (workflow_call) before it packages anything, so the
# gates cannot drift apart.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

# A second push to the same branch or PR makes the first run's answer irrelevant before it
# has finished producing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Nothing here publishes anything.
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Third-party actions are on major-version tags rather than commit SHAs — see DEV.md,
      # "Pinned actions".
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: VERSION is SemVer
        run: |
          v=$(tr -d '\r\n' < VERSION)
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$v' is not MAJOR.MINOR.PATCH[-prerelease] (DEV.md, Versioning)"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - name: gofmt
        run: |
          out=$(gofmt -l go)
          if [ -n "$out" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go -C go vet ./...

      - name: go test
        run: go -C go test ./...

      # The same script a developer runs locally, so the binaries CI vouches for are built the
      # way release binaries are.
      - name: Build binaries
        shell: pwsh
        run: ./go/build.ps1

      - name: Binary reports VERSION
        run: |
          got=$(go/dist/pinplan-linux-amd64 --version)
          if [ "$got" != "PinPlan $VERSION" ]; then
            echo "::error::the binary says '$got', VERSION says $VERSION"
            exit 1
          fi
          echo "$got"

      - name: Smoke test
        run: |
          bin=go/dist/pinplan-linux-amd64
          "$bin" --start 2026-01-01 -o "$RUNNER_TEMP/jan1.pdf"
          "$bin" --start 2026-11-07 --period 90d -o "$RUNNER_TEMP/mid.pdf"
          ex=docs/timeline/examples
          "$bin" --today 2026-11-11 --start 2026-11-11 --period 120d --file "$ex/exams.dates" -o "$RUNNER_TEMP/timeline.pdf"
          "$bin" --today 2026-11-11 --start 2026-11-11 --file "$ex/year-plan.dates" --timeline-layout flow -o "$RUNNER_TEMP/flow.pdf"
          # a broken declaration fails with exit code 2 and writes nothing
          code=0
          "$bin" --milestone 'x=@nope' -o "$RUNNER_TEMP/bad.pdf" || code=$?
          if [ "$code" != 2 ] || [ -e "$RUNNER_TEMP/bad.pdf" ]; then
            echo "::error::a broken declaration gave exit code $code or wrote a PDF"
            exit 1
          fi
